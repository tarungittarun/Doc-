<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doc App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">Doc<span>App</span></div>
      <div class="toolbar">
        <button id="newDocBtn" class="btn primary" title="New document">+ New</button>
        <button id="exportBtn" class="btn" title="Export as Markdown">Export .md</button>
        <button id="exportTxtBtn" class="btn" title="Export as plain text">Export .txt</button>
      </div>
    </header>

    <div class="sidebar" aria-label="Documents">
      <h2>Documents</h2>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search documents…" />
      </div>
      <ul id="docList" class="doc-list" role="list"></ul>
      <p id="emptyState" class="empty" hidden>No documents yet. Create one to get started.</p>
    </div>

    <main class="editor" aria-label="Editor">
      <div class="editor-shell" hidden>
        <div class="editor-top">
          <input type="text" id="titleInput" placeholder="Untitled document" />
          <div class="actions">
            <button id="deleteBtn" class="btn danger" title="Delete document">Delete</button>
          </div>
        </div>
        <textarea id="contentInput" placeholder="Start writing…"></textarea>
        <div class="editor-footer">
          <span id="status"></span>
          <button id="previewBtn" class="btn toggle" title="Toggle preview">Preview</button>
        </div>
      </div>
      <div class="editor-empty" hidden>
        <p>Select a document from the list, or create a new one.</p>
      </div>
      <div id="preview" class="preview hidden"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
