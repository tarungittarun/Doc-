name: OneDoc Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code (integer)"
        required: true
        default: "1"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Budget C8: max 3 parallel runners, <= 30 jobs per run. This lane: 4 jobs.
jobs:
  build-release:
    name: Assemble release APKs (full + writer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup log directory
        run: mkdir -p ci-logs/release-build
      - name: Install Gradle 8.14.2
        run: |
          set -o pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.2-bin.zip -o /tmp/gradle.zip 2>&1 | tee ci-logs/release-build/gradle-download.log
          curl_exit=${PIPESTATUS[0]}
          test $curl_exit -eq 0 || { echo "::error::Gradle download failed (exit $curl_exit)"; exit 1; }
          unzip -q /tmp/gradle.zip -d /opt 2>&1 | tee -a ci-logs/release-build/gradle-download.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::Gradle unzip failed"; exit 1; }
          echo "/opt/gradle-8.14.2/bin" >> $GITHUB_PATH
          echo "Gradle 8.14.2 installed successfully" | tee -a ci-logs/release-build/gradle-download.log
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate JDK 21
        run: |
          java -version 2>&1 | tee ci-logs/release-build/jdk-version.log
          java_version=$(java -version 2>&1 | head -1)
          echo "$java_version" | grep -q "21" || { echo "::error::JDK 21 not found: $java_version"; exit 1; }
          echo "JDK 21 validated" | tee -a ci-logs/release-build/jdk-version.log
      - name: Report toolchain
        run: |
          set -x
          java -version 2>&1 | tee -a ci-logs/release-build/toolchain.log
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a ci-logs/release-build/toolchain.log
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee -a ci-logs/release-build/toolchain.log
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK" 2>&1 | tee -a ci-logs/release-build/toolchain.log
          gradle --version 2>&1 | tee -a ci-logs/release-build/toolchain.log
      - name: Install missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 | tee ci-logs/release-build/sdk-licenses.log
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee ci-logs/release-build/sdk-install.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::SDK package install failed"; exit 1; }
      - name: Verify committed debug keystore for same-app updates
        run: |
          if [ ! -f debug.keystore ]; then
            echo "::error::debug.keystore not found in repo — same-app updates will break" | tee ci-logs/release-build/keystore-verify.log
            exit 1
          fi
          echo "Using committed debug.keystore for release signing" | tee ci-logs/release-build/keystore-verify.log
          ls -l debug.keystore | tee -a ci-logs/release-build/keystore-verify.log
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk21-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-jdk21-
      - name: Set version from inputs
        run: |
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.event.inputs.version_code }}" >> $GITHUB_ENV
          echo "Version: ${{ github.event.inputs.version }}, VersionCode: ${{ github.event.inputs.version_code }}" | tee ci-logs/release-build/version.log
      - name: Apply versioning (versionCode/versionName)
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${{ github.event.inputs.version }}\"/" app/build.gradle.kts
          grep "versionCode\|versionName" app/build.gradle.kts | tee ci-logs/release-build/version-applied.log
      - name: Assemble release APKs (RC debug keystore until owner keystore)
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleFullRelease assembleWriterRelease 2>&1 | tee ci-logs/release-build/gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "build_exit=$BUILD_EXIT" >> $GITHUB_OUTPUT
          echo "Release build exit code: $BUILD_EXIT" | tee -a ci-logs/release-build/gradle-build.log
      - name: Surface release build errors
        if: steps.build.outputs.build_exit != '0'
        shell: bash
        run: |
          esc() { sed 's/%/%25/g; s/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }'; }
          { grep -nE "^e: |error:|FAILURE|What went wrong|Execution failed|Caused by:|Could not resolve|Unresolved|Plugin.*not found|Could not.*compile" ci-logs/release-build/gradle-build.log | head -20
            echo "--- last 30 lines ---"
            tail -30 ci-logs/release-build/gradle-build.log; } | esc | { body=$(cat); echo "::error title=build-release::${body}"; }
      - name: Compute APK SHA-256 + size
        id: hashes
        if: steps.build.outputs.build_exit == '0'
        run: |
          shopt -s globstar
          found=0
          for apk in app/build/outputs/apk/**/release/*.apk; do
            sha=$(sha256sum "$apk" | awk '{print $1}')
            size=$(stat -c%s "$apk")
            name=$(basename "$apk")
            echo "APK_${name}=${sha}" >> $GITHUB_OUTPUT
            echo "APK_SIZE_${name}=$size" >> $GITHUB_OUTPUT
            echo "APK_PATH_${name}=$apk" >> $GITHUB_OUTPUT
            echo "$name: sha=$sha size=$size path=$apk" | tee -a ci-logs/release-build/apk-hashes.log
            found=1
          done
          test $found -eq 1 || { echo "::error::No release APKs found"; exit 1; }
      - name: Upload release APKs as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apks-${{ github.run_id }}
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 90
          if-no-files-found: warn
      - name: Upload release-build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-release-build
          path: ci-logs/release-build/
          retention-days: 30
          if-no-files-found: warn

  provenance:
    name: Build provenance.json
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [build-release]
    steps:
      - uses: actions/checkout@v4
      - name: Setup log directory
        run: mkdir -p ci-logs/provenance
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks-${{ github.run_id }}
          path: release-apks
          github-token: ${{ github.token }}
      - name: Write provenance.json
        id: prov
        run: |
          sha_full=$(sha256sum release-apks/*full*-release.apk 2>/dev/null | awk '{print $1}' | head -1)
          sha_writer=$(sha256sum release-apks/*writer*-release.apk 2>/dev/null | awk '{print $1}' | head -1)
          size_full=$(stat -c%s release-apks/*full*-release.apk 2>/dev/null | head -1)
          size_writer=$(stat -c%s release-apks/*writer*-release.apk 2>/dev/null | head -1)
          cat > provenance.json <<EOF
          {
            "version": "${{ github.event.inputs.version }}",
            "versionCode": ${{ github.event.inputs.version_code }},
            "commitSha": "${{ github.sha }}",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "apkFull": {
              "sha256": "${sha_full}",
              "sizeBytes": ${size_full:-0},
              "applicationId": "app.onedoc",
              "flavor": "full"
            },
            "apkWriter": {
              "sha256": "${sha_writer}",
              "sizeBytes": ${size_writer:-0},
              "applicationId": "app.onedoc",
              "flavor": "writer"
            },
            "catalogueVersion": "qa/onedoc/testcases.csv @ ${{ github.sha }}",
            "toolVersions": {
              "jdk": "21",
              "compileSdk": "36",
              "buildTools": "36.0.0",
              "minSdk": "26",
              "targetSdk": "36"
            },
            "signedWith": "RC debug keystore (owner keystore pending at G8 Day-6 per kickoff §7)",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat provenance.json | tee ci-logs/provenance/provenance.log
      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: provenance-${{ github.run_id }}
          path: provenance.json
          retention-days: 90
      - name: Upload provenance logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-provenance
          path: ci-logs/provenance/
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-release, provenance]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Setup log directory
        run: mkdir -p ci-logs/release
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks-${{ github.run_id }}
          path: release-apks
          github-token: ${{ github.token }}
      - name: Download provenance
        uses: actions/download-artifact@v4
        with:
          name: provenance-${{ github.run_id }}
          path: .
          github-token: ${{ github.token }}
      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          # OneDoc v${{ github.event.inputs.version }}

          Release built from commit ${{ github.sha }} on branch arena/db667982-doc.

          ## Artifacts
          - OneDoc full (app.onedoc) — see provenance.json for SHA-256
          - OneDoc writer flavor (app.onedoc) — see provenance.json for SHA-256

          ## Signing
          RC debug keystore. Owner keystore to be applied at G8 (Day-6 per kickoff §7).

          ## Privacy
          - No INTERNET / ACCESS_NETWORK_STATE permission
          - No sign-in, no ads, no trackers, no analytics
          - 100% local/on-device

          ## Verification
          Recompute APK SHA-256 and match against provenance.json before install.
          EOF
          cat release-notes.md | tee ci-logs/release/release-notes.log
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: "OneDoc v${{ github.event.inputs.version }}"
          body_path: release-notes.md
          files: |
            release-apks/*.apk
            provenance.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-release
          path: ci-logs/release/
          retention-days: 30
          if-no-files-found: warn
