name: Java 17 Chunks

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  java-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dirs
        run: |
          mkdir -p tools/chunks/java17 tools/scripts

      - name: Install Java 17 JDK via apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk
          java -version 2>&1
          which java
          ls -la /usr/lib/jvm/

      - name: Chunk Java 17
        run: |
          JAVA_DIR=$(ls -d /usr/lib/jvm/java-17-openjdk-* | head -1)
          echo "Java dir: $JAVA_DIR"
          cd "$JAVA_DIR"
          tar -cf /tmp/java17.tar .
          split -b 48M -d /tmp/java17.tar $GITHUB_WORKSPACE/tools/chunks/java17/java17.tar.part.
          echo "Java chunks: $(ls $GITHUB_WORKSPACE/tools/chunks/java17/ | wc -l)"
          ls -la $GITHUB_WORKSPACE/tools/chunks/java17/

      - name: Commit chunks
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tools/chunks/java17/
          git commit -m "chore: Commit Java 17 chunks [skip ci]"
          git push
