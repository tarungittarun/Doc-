name: Test Chunk Commit

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-chunk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and chunk test file
        run: |
          mkdir -p tools/chunks/test
          dd if=/dev/zero of=/tmp/testfile bs=1M count=50 2>/dev/null
          split -b 10M -d /tmp/testfile tools/chunks/test/test.part.
          ls -la tools/chunks/test/
          echo "Chunk count: $(ls tools/chunks/test/ | wc -l)"
      - name: Commit chunks
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tools/chunks/test/
          git commit -m "chore: Test chunk commit [skip ci]"
          git push
          echo "Committed"
