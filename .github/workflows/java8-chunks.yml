name: Java 8 Chunks (glibc 2.36 compatible)

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  java8-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dirs
        run: |
          mkdir -p tools/chunks/java8 tools/scripts

      - name: Add Debian 10 buster sources
        run: |
          echo "deb http://deb.debian.org/debian buster main" > /tmp/buster.list
          sudo cp /tmp/buster.list /etc/apt/sources.list.d/buster.list
          sudo apt-get update -qq 2>&1 | tail -5

      - name: Download Java 8 JDK from Debian 10
        run: |
          cd /tmp
          sudo apt-get download openjdk-8-jdk 2>&1 | tail -5
          ls -la *.deb

      - name: Extract Java 8
        run: |
          cd /tmp
          DEB=$(ls *.deb | head -1)
          echo "Extracting: $DEB"
          dpkg-deb -x "$DEB" java8-extract
          JAVA_DIR=$(find java8-extract/usr/lib/jvm -maxdepth 1 -type d -name 'java-8*' | head -1)
          echo "Java dir: $JAVA_DIR"
          mkdir -p java8-flat
          cp -a "$JAVA_DIR"/* java8-flat/
          ls java8-flat/bin/java

      - name: Chunk Java 8
        run: |
          cd /tmp/java8-flat
          tar -cf /tmp/java8.tar .
          split -b 48M -d /tmp/java8.tar $GITHUB_WORKSPACE/tools/chunks/java8/java8.tar.part.
          echo "Java 8 chunks: $(ls $GITHUB_WORKSPACE/tools/chunks/java8/ | wc -l)"

      - name: Commit chunks
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tools/chunks/java8/
          git commit -m "chore: Commit Java 8 chunks (glibc 2.36 compatible) [skip ci]"
          git push
