name: Java 8 Chunks

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  java8:
    runs-on: ubuntu-20.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: mkdir -p tools/chunks/java8
      - run: sudo apt-get update && sudo apt-get install -y openjdk-8-jdk
      - run: |
          J=$(ls -d /usr/lib/jvm/java-8-openjdk-* | head -1)
          cd "$J"
          tar -cf /tmp/j8.tar .
          split -b 48M -d /tmp/j8.tar $GITHUB_WORKSPACE/tools/chunks/java8/j8.tar.part.
      - run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tools/chunks/java8/
          git commit -m "chore: Java 8 chunks [skip ci]" || true
          git push
