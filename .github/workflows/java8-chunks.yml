name: Java 8 Chunks (glibc 2.36 compatible)

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  java8-chunks:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dirs
        run: |
          mkdir -p tools/chunks/java8 tools/scripts

      - name: Install Java 8 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'
          cache: false

      - name: Locate Java 8 installation
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la "$JAVA_HOME"
          ls -la "$JAVA_HOME/bin/java"

      - name: Chunk Java 8
        run: |
          cd "$JAVA_HOME"
          tar -cf /tmp/java8.tar .
          split -b 48M -d /tmp/java8.tar $GITHUB_WORKSPACE/tools/chunks/java8/java8.tar.part.
          echo "Java 8 chunks: $(ls $GITHUB_WORKSPACE/tools/chunks/java8/ | wc -l)"

      - name: Commit chunks
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tools/chunks/java8/
          git commit -m "chore: Commit Java 8 chunks (glibc 2.36 compatible via Ubuntu 22.04 + Zulu) [skip ci]"
          git push
