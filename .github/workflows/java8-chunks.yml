name: Java 8 Chunks (glibc 2.36 compatible)

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  java8-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dirs
        run: |
          mkdir -p tools/chunks/java8 tools/scripts

      - name: Install debootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap

      - name: Create Debian 10 buster chroot (glibc 2.28)
        run: |
          sudo debootstrap --arch=amd64 buster /tmp/debian10 http://deb.debian.org/debian/
          echo "Debootstrap complete"

      - name: Install Java 8 in Debian 10 chroot
        run: |
          sudo chroot /tmp/debian10 apt-get update -qq
          sudo chroot /tmp/debian10 apt-get install -y -qq openjdk-8-jdk
          echo "Java 8 installed in chroot"
          sudo chroot /tmp/debian10 java -version 2>&1

      - name: Extract Java 8 from chroot
        run: |
          JAVA_DIR=$(sudo chroot /tmp/debian10 ls -d /usr/lib/jvm/java-8-openjdk-* | head -1)
          echo "Java dir in chroot: $JAVA_DIR"
          mkdir -p /tmp/java8-flat
          sudo cp -a /tmp/debian10/$JAVA_DIR/* /tmp/java8-flat/
          sudo chown -R $(whoami):$(whoami) /tmp/java8-flat
          ls /tmp/java8-flat/bin/java

      - name: Chunk Java 8
        run: |
          cd /tmp/java8-flat
          tar -cf /tmp/java8.tar .
          split -b 48M -d /tmp/java8.tar $GITHUB_WORKSPACE/tools/chunks/java8/java8.tar.part.
          echo "Java 8 chunks: $(ls $GITHUB_WORKSPACE/tools/chunks/java8/ | wc -l)"

      - name: Commit chunks
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tools/chunks/java8/
          git commit -m "chore: Commit Java 8 chunks (glibc 2.36 compatible via Debian 10) [skip ci]"
          git push
