name: OneDoc APK Artifact

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-commit-apk:
    name: Build release APK and commit to repo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Java and keytool
        run: |
          echo "=== Java version ===" | tee ci-logs/apk-artifact/java.log
          java -version 2>&1 | tee -a ci-logs/apk-artifact/java.log
          echo "=== keytool ===" | tee -a ci-logs/apk-artifact/java.log
          keytool -version 2>&1 | tee -a ci-logs/apk-artifact/java.log
          echo "=== ANDROID_HOME ===" | tee -a ci-logs/apk-artifact/java.log
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a ci-logs/apk-artifact/java.log
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee -a ci-logs/apk-artifact/java.log
          ls "$ANDROID_HOME" 2>&1 | tee -a ci-logs/apk-artifact/java.log

      - name: Install missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tee ci-logs/apk-artifact/sdk-install.log

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip 2>&1 | tee ci-logs/apk-artifact/gradle-download.log
          unzip -q /tmp/gradle.zip -d /opt 2>&1 | tee -a ci-logs/apk-artifact/gradle-download.log
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
          echo "Gradle installed" | tee -a ci-logs/apk-artifact/gradle-download.log

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          cat local.properties | tee ci-logs/apk-artifact/local-properties.log

      - name: Build release APK
        run: |
          set +e
          gradle --no-daemon --stacktrace --max-workers=1 assembleRelease 2>&1 | tee ci-logs/apk-artifact/gradle-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $GRADLE_EXIT" | tee -a ci-logs/apk-artifact/gradle-build.log
          exit $GRADLE_EXIT

      - name: Commit APK to repo
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "Found APK: $APK_PATH" | tee ci-logs/apk-artifact/apk-commit.log
          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK found" | tee -a ci-logs/apk-artifact/apk-commit.log
            exit 1
          fi
          cp "$APK_PATH" OneDoc-release.apk
          ls -l OneDoc-release.apk | tee -a ci-logs/apk-artifact/apk-commit.log
          sha256sum OneDoc-release.apk | tee -a ci-logs/apk-artifact/apk-commit.log
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -f OneDoc-release.apk ci-logs/apk-artifact/ 2>&1 | tee -a ci-logs/apk-artifact/apk-commit.log
          git commit -m "chore: Add OneDoc-release.apk (versionCode 6, versionName 1.0.5) [skip ci]" 2>&1 | tee -a ci-logs/apk-artifact/apk-commit.log
          git push 2>&1 | tee -a ci-logs/apk-artifact/apk-commit.log
          echo "APK committed and pushed to repo" | tee -a ci-logs/apk-artifact/apk-commit.log

      - name: Upload APK logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-apk-artifact
          path: ci-logs/apk-artifact/
          retention-days: 30
          if-no-files-found: warn
