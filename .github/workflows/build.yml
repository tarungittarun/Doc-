name: OneDoc Android CI

on:
  push:
    branches: ["arena/db667982-doc"]
  pull_request:
    branches: ["arena/db667982-doc"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Traceability --check --strict
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tool deps
        run: python3 -m pip -q install pyyaml
      - name: Run traceability check (strict)
        run: python3 tools/onedoc/traceability.py --check --strict

  build-debug:
    name: Assemble debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [traceability]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Ensure signing key
        run: |
          if [ ! -f signing/onedoc.p12 ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/onedoc.p12 -storetype pkcs12 \
              -storepass onedoc-sideload -keypass onedoc-sideload -alias onedoc \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=OneDoc Sideload, OU=Sideload, O=OneDoc, C=IN"
          fi
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-
      - name: Build debug APK
        id: build-debug-step
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleFullDebug assembleWriterDebug > /tmp/build.log 2>&1 || true
          cat /tmp/build.log
      - name: Surface debug build errors
        if: steps.build-debug-step.outcome == 'failure'
        shell: bash
        run: |
          esc() { sed 's/%/%25/g; s/\r//g; s/\n/%0A/g'; }
          echo "::error::=== FULL BUILD LOG (first 60 lines) ==="
          head -60 /tmp/build.log | while IFS= read -r line; do echo "::error::$(echo "$line" | esc)"; done
          echo "::error::=== BUILD LOG (lines 60-120) ==="
          sed -n '60,120p' /tmp/build.log | while IFS= read -r line; do echo "::error::$(echo "$line" | esc)"; done
          echo "::error::=== BUILD LOG (last 40 lines) ==="
          tail -40 /tmp/build.log | while IFS= read -r line; do echo "::error::$(echo "$line" | esc)"; done
      - name: Fail if build failed
        if: steps.build-debug-step.outcome == 'failure'
        run: exit 1

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-debug-apks
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn

  build-release:
    name: Assemble release APKs + static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Ensure signing key
        run: |
          if [ ! -f signing/onedoc.p12 ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/onedoc.p12 -storetype pkcs12 \
              -storepass onedoc-sideload -keypass onedoc-sideload -alias onedoc \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=OneDoc Sideload, OU=Sideload, O=OneDoc, C=IN"
          fi
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-
      - name: Build release APK
        id: build-release-step
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleFullRelease > /tmp/build-release.log 2>&1
          cat /tmp/build-release.log
      - name: Surface release build errors
        if: steps.build-release-step.outcome == 'failure'
        shell: bash
        run: |
          esc() { sed 's/%/%25/g; s/\r//g; s/\n/%0A/g'; }
          echo "::error::=== FULL BUILD LOG (first 60 lines) ==="
          head -60 /tmp/build-release.log | while IFS= read -r line; do echo "::error::$(echo "$line" | esc)"; done
          echo "::error::=== BUILD LOG (lines 60-120) ==="
          sed -n '60,120p' /tmp/build-release.log | while IFS= read -r line; do echo "::error::$(echo "$line" | esc)"; done
          echo "::error::=== BUILD LOG (last 40 lines) ==="
          tail -40 /tmp/build-release.log | while IFS= read -r line; do echo "::error::$(echo "$line" | esc)"; done
      - name: Fail if release build failed
        if: steps.build-release-step.outcome == 'failure'
        run: exit 1
      - name: "Static gate: no internet permission"
        run: |
          if grep -qE 'android.permission.INTERNET|ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml; then
            echo "FAIL: internet permission present in manifest" >&2
            exit 1
          fi
          echo "PASS: no internet permission in manifest"
      - name: "Static gate: APK size"
        shell: bash
        run: |
          found=0
          for apk in app/build/outputs/apk/*/release/*.apk; do
            [ -f "$apk" ] || continue
            found=1
            size=$(stat -c%s "$apk")
            if [ "$size" -gt 26214400 ]; then
              echo "FAIL: $apk exceeds 25 MB" >&2
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "WARN: no release APKs found"
          fi
          echo "PASS: APK size <= 25 MB"
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-release-apks
          path: app/build/outputs/apk/*/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  verify-ci-lane:
    name: CI lane green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [traceability, build-debug, build-release]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: |
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job statuses: $statuses"
          if echo "$statuses" | grep -q 'failure\|cancelled'; then
            echo "CI lane not green" >&2
            exit 1
          fi
          echo "PASS: CI lane green"
