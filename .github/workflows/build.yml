name: OneDoc Android CI

on:
  push:
    branches: ["arena/db667982-doc"]
  pull_request:
    branches: ["arena/db667982-doc"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Traceability check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tool deps
        run: python3 -m pip -q install pyyaml
      - name: Run traceability check
        run: python3 tools/onedoc/traceability.py --check --strict

  build-debug:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [traceability]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" && echo "::notice::SDK_PATH=$SDK" && yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true && "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
      - name: Gradle version
        run: |
          echo "::notice::GRADLE_VERSION: $(gradle --version 2>&1 | grep 'Gradle ' | head -1)"
          gradle --version
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleFullDebug 2>&1 | tee /tmp/build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "::notice::GRADLE_EXIT=$GRADLE_EXIT"
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "::error title=Gradle build failed::Exit code $GRADLE_EXIT"
            echo "::error title=Log tail::$(tail -5 /tmp/build.log 2>/dev/null | tr '\n' '|' | sed 's/%/%25/g; s/\r//g; s/:/%3A/g')"
          fi
          exit $GRADLE_EXIT
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  build-release:
    name: Build release APKs + static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" && echo "::notice::SDK_PATH=$SDK" && yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true && "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
      - name: Gradle version
        run: gradle --version
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleFullRelease 2>&1 | tee /tmp/build-release.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "::notice::GRADLE_EXIT=$GRADLE_EXIT"
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "::error::BUILD_FAILED_EXIT=$GRADLE_EXIT"
            echo "::error::LOG_TAIL:$(tail -5 /tmp/build-release.log 2>/dev/null | tr '\n' '|' | sed 's/%/%25/g; s/\r//g; s/:/%3A/g')"
          fi
          exit $GRADLE_EXIT
      - name: "Static gate: no internet permission"
        run: |
          if grep -rqi 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'FAIL: internet permission present'; exit 1; fi
          if grep -rqi 'ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml; then echo 'FAIL: network permission present'; exit 1; fi
          echo 'PASS: no internet permission'
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-release-apks
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  verify-ci-lane:
    name: CI lane green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [traceability, build-debug, build-release]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: |
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job statuses: $statuses"
          if echo "$statuses" | grep -q 'failure'; then echo 'CI lane not green'; exit 1; fi
          echo 'PASS: CI lane green'
