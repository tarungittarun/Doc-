name: OneDoc Android CI

on:
  push:
    branches: ["arena/db667982-doc"]
  pull_request:
    branches: ["arena/db667982-doc"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Traceability --check --strict
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tool deps
        run: python3 -m pip -q install pyyaml
      - name: Run traceability check (strict)
        run: python3 tools/onedoc/traceability.py --check --strict

  build-debug:
    name: Assemble debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [traceability]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Ensure signing key
        run: |
          if [ ! -f signing/onedoc.p12 ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/onedoc.p12 -storetype pkcs12 \
              -storepass onedoc-sideload -keypass onedoc-sideload -alias onedoc \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=OneDoc Sideload, OU=Sideload, O=OneDoc, C=IN"
          fi
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-
      - name: Build debug APK
        id: build-debug-step
        shell: bash
        run: |
          esc() { sed 's/%/%25/g; s/\r//g; s/\n/%0A/g; s/:/%3A/g'; }
          echo "::notice::DEBUG: which=$(which gradle 2>&1 | esc)"
          echo "::notice::DEBUG: java=$(java -version 2>&1 | head -1 | esc)"
          echo "::notice::DEBUG: Running gradle --stacktrace assembleFullDebug..."
          gradle --no-daemon --stacktrace --info assembleFullDebug > /tmp/gradle-debug.out 2>&1 || GRADLE_EXIT=$?
          echo "::notice::DEBUG: GRADLE_EXIT_CODE=${GRADLE_EXIT:-0}"
          echo "::notice::DEBUG: OUTPUT_FILE_SIZE=$(wc -c < /tmp/gradle-debug.out 2>/dev/null || echo 0)"
          echo "::notice::DEBUG: WHAT_WENT_WRONG=$(sed -n '/What went wrong/,/^$/p' /tmp/gradle-debug.out 2>/dev/null | head -5 | esc)"
          echo "::notice::DEBUG: CAUSED_BY=$(grep -A3 'Caused by' /tmp/gradle-debug.out 2>/dev/null | head -6 | esc)"
          echo "::notice::DEBUG: EXCEPTIONS=$(grep -E 'Exception:|Could not|A problem occurred|Build failed' /tmp/gradle-debug.out 2>/dev/null | grep -v error_prone | head -8 | esc)"
          echo "::notice::DEBUG: OUTPUT_TAIL=$(tail -20 /tmp/gradle-debug.out 2>/dev/null | esc)"
          APKS=$(find app -name "*.apk" -type f 2>/dev/null || true)
          if [ -n "$APKS" ]; then
            echo "::notice::DEBUG APKS: $(printf '%s' "$APKS" | tr '\n' ' ')"
          else
            echo "::error::DEBUG BUILD: NO APKS FOUND"
          fi
      - name: Annotate debug build result (always)
        shell: bash
        run: |
          esc() { sed 's/%/%25/g; s/\r//g; s/\n/%0A/g'; }
          APKS=$(find app -name "*.apk" -type f 2>/dev/null || true)
          if [ -n "$APKS" ]; then
            echo "::notice::DEBUG APKS: $(printf '%s' "$APKS" | tr '\n' ' ' | esc)"
          else
            echo "::error::DEBUG BUILD: NO APKS FOUND"
          fi
      - name: Fail if build failed
        if: steps.build-debug-step.outcome == 'failure'
        run: exit 1
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  build-release:
    name: Assemble release APKs + static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Ensure signing key
        run: |
          if [ ! -f signing/onedoc.p12 ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/onedoc.p12 -storetype pkcs12 \
              -storepass onedoc-sideload -keypass onedoc-sideload -alias onedoc \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=OneDoc Sideload, OU=Sideload, O=OneDoc, C=IN"
          fi
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-
      - name: Build release APK
        id: build-release-step
        shell: bash
        run: |
          esc() { sed 's/%/%25/g; s/\r//g; s/\n/%0A/g; s/:/%3A/g'; }
          echo "::notice::RELEASE: which=$(which gradle 2>&1 | esc)"
          echo "::notice::RELEASE: java=$(java -version 2>&1 | head -1 | esc)"
          echo "::notice::RELEASE: Running gradle --stacktrace assembleFullRelease..."
          gradle --no-daemon --stacktrace --info assembleFullRelease > /tmp/gradle-release.out 2>&1 || GRADLE_EXIT=$?
          echo "::notice::RELEASE: GRADLE_EXIT_CODE=${GRADLE_EXIT:-0}"
          echo "::notice::RELEASE: OUTPUT_FILE_SIZE=$(wc -c < /tmp/gradle-release.out 2>/dev/null || echo 0)"
          echo "::notice::RELEASE: WHAT_WENT_WRONG=$(sed -n '/What went wrong/,/^$/p' /tmp/gradle-release.out 2>/dev/null | head -5 | esc)"
          echo "::notice::RELEASE: CAUSED_BY=$(grep -A3 'Caused by' /tmp/gradle-release.out 2>/dev/null | head -6 | esc)"
          echo "::notice::RELEASE: EXCEPTIONS=$(grep -E 'Exception:|Could not|A problem occurred|Build failed' /tmp/gradle-release.out 2>/dev/null | grep -v error_prone | head -8 | esc)"
          echo "::notice::debug: OUTPUT_TAIL=$(tail -20 /tmp/gradle-release.out 2>/dev/null | esc)"
          APKS=$(find app -name "*.apk" -type f 2>/dev/null || true)
          if [ -n "$APKS" ]; then
            echo "::notice::RELEASE APKS: $(printf '%s' "$APKS" | tr '\n' ' ')"
          else
            echo "::error::RELEASE BUILD: NO APKS FOUND"
          fi
      - name: Annotate release build result (always)
        shell: bash
        run: |
          esc() { sed 's/%/%25/g; s/\r//g; s/\n/%0A/g'; }
          APKS=$(find app -name "*.apk" -type f 2>/dev/null || true)
          if [ -n "$APKS" ]; then
            echo "::notice::RELEASE APKS: $(printf '%s' "$APKS" | tr '\n' ' ' | esc)"
          else
            echo "::error::RELEASE BUILD: NO APKS FOUND"
          fi
      - name: Fail if release build failed
        if: steps.build-release-step.outcome == 'failure'
        run: exit 1
      - name: "Static gate: no internet permission"
        run: |
          if grep -qE 'android.permission.INTERNET|ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml; then
            echo "FAIL: internet permission present in manifest" >&2
            exit 1
          fi
          echo "PASS: no internet permission in manifest"
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-release-apks
          path: app/build/outputs/apk/*/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  verify-ci-lane:
    name: CI lane green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [traceability, build-debug, build-release]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: |
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job statuses: $statuses"
          if echo "$statuses" | grep -q 'failure\|cancelled'; then
            echo "CI lane not green" >&2
            exit 1
          fi
          echo "PASS: CI lane green"
