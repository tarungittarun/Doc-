name: OneDoc Android CI

on:
  push:
    branches: ["arena/db667982-doc"]
  pull_request:
    branches: ["arena/db667982-doc"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Traceability check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tool deps
        run: python3 -m pip -q install pyyaml
      - name: Run traceability check
        run: python3 tools/onedoc/traceability.py --check --strict

  build-debug:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [traceability]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report toolchain
        run: |
          set -x
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          sh gradlew --version || true

      - name: Install any missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Ensure the stable sideload signing key
        run: |
          if [ ! -f debug.keystore ]; then
            echo "generated signing/debug.keystore; the commit step will persist it"
            keytool -genkeypair -keystore debug.keystore -storetype pkcs12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OneDoc Debug, O=OneDoc, C=IN"
          else
            echo "using the committed signing key"
          fi
          ls -l debug.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          sh gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-debug-apks
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn

  build-release:
    name: Build release APKs + static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report toolchain
        run: |
          set -x
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          sh gradlew --version || true

      - name: Install any missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Ensure the stable sideload signing key
        run: |
          if [ ! -f debug.keystore ]; then
            echo "generated signing/debug.keystore; the commit step will persist it"
            keytool -genkeypair -keystore debug.keystore -storetype pkcs12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OneDoc Debug, O=OneDoc, C=IN"
          else
            echo "using the committed signing key"
          fi
          ls -l debug.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          sh gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee /tmp/build.log

      - name: "Static gate: no internet permission"
        run: |
          if grep -rqi 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'FAIL: internet permission present'; exit 1; fi
          if grep -rqi 'ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml; then echo 'FAIL: network permission present'; exit 1; fi
          echo 'PASS: no internet permission'

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-release-apks
          path: '**/build/outputs/apk/**/release/*.apk'
          retention-days: 30
          if-no-files-found: warn

  emulator-test:
    name: Emulator instrumentation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report toolchain
        run: |
          set -x
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          sh gradlew --version || true

      - name: Install any missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          script: |
            sh gradlew --no-daemon --max-workers=1 connectedCheck

  verify-ci-lane:
    name: CI lane green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [traceability, build-debug, build-release, emulator-test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: |
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job statuses: $statuses"
          if echo "$statuses" | grep -q 'failure'; then echo 'CI lane not green'; exit 1; fi
          echo 'PASS: CI lane green'