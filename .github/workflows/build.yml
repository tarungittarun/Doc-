name: OneDoc Android CI

on:
  push:
    branches: ["arena/db667982-doc"]
  pull_request:
    branches: ["arena/db667982-doc"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Traceability check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tool deps
        run: python3 -m pip -q install pyyaml
      - name: Run traceability check
        run: python3 tools/onedoc/traceability.py --check --strict

  build-debug:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [traceability]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" && yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true && "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Ensure signing key
        run: if [ ! -f signing/onedoc.p12 ]; then mkdir -p signing && keytool -genkeypair -keystore signing/onedoc.p12 -storetype pkcs12 -storepass onedoc-sideload -keypass onedoc-sideload -alias onedoc -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=OneDoc Sideload, OU=Sideload, O=OneDoc, C=IN"; fi
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleFullDebug 2>&1 | tee /tmp/build.log
      - name: List APK output directories
        run: |
          APKS=$(find app/build -name "*.apk" -type f 2>/dev/null || true)
          if [ -n "$APKS" ]; then
            echo "::notice::APKS_FOUND: $APKS"
          else
            echo "::error::NO_APKS_FOUND"
            find app/build -type d 2>/dev/null | head -20
          fi
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  build-release:
    name: Build release APKs + static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" && yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true && "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Ensure signing key
        run: if [ ! -f signing/onedoc.p12 ]; then mkdir -p signing && keytool -genkeypair -keystore signing/onedoc.p12 -storetype pkcs12 -storepass onedoc-sideload -keypass onedoc-sideload -alias onedoc -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=OneDoc Sideload, OU=Sideload, O=OneDoc, C=IN"; fi
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-
      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleFullRelease 2>&1 | tee /tmp/build-release.log
      - name: "Static gate: no internet permission"
        run: |
          if grep -rqi 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'FAIL: internet permission present'; exit 1; fi
          if grep -rqi 'ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml; then echo 'FAIL: network permission present'; exit 1; fi
          echo 'PASS: no internet permission'
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-release-apks
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  verify-ci-lane:
    name: CI lane green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [traceability, build-debug, build-release]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: |
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job statuses: $statuses"
          if echo "$statuses" | grep -q 'failure'; then echo 'CI lane not green'; exit 1; fi
          echo 'PASS: CI lane green'
