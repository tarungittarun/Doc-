        run: |
          echo "::notice::PLATFORMS:$(ls $ANDROID_HOME/platforms/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')" | tee ci-logs/emulator-shard-2/sdk-platforms.log
          test -d "$ANDROID_HOME/platforms" || { echo "::error::ANDROID_HOME/platforms not found"; exit 1; }
      - name: List SDK build-tools
        run: |
          echo "::notice::BUILD_TOOLS:$(ls $ANDROID_HOME/build-tools/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')" | tee ci-logs/emulator-shard-2/sdk-build-tools.log
          test -d "$ANDROID_HOME/build-tools" || { echo "::error::ANDROID_HOME/build-tools not found"; exit 1; }
      - name: Install missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 | tee ci-logs/emulator-shard-2/sdk-licenses.log || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee ci-logs/emulator-shard-2/sdk-install.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::SDK package install failed"; exit 1; }
      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          cat local.properties | tee ci-logs/emulator-shard-2/local-properties.log
      - name: Build debug + test APKs
        run: |
          set +e
          /opt/gradle-8.10.2/bin/gradle --no-daemon --max-workers=1 --stacktrace assembleDebug assembleDebugAndroidTest 2>&1 | tee ci-logs/emulator-shard-2/gradle-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "::notice::GRADLE_EXIT=$GRADLE_EXIT"
          grep -E '^(e:|Execution failed|FAILED|Exception|Caused by|Error:|Could not|What went wrong)' ci-logs/emulator-shard-2/gradle-build.log 2>/dev/null | head -60 | while read line; do echo "::notice::GRADLE_KEY: $line"; done
          echo "Build debug+test exit code: $GRADLE_EXIT" | tee -a ci-logs/emulator-shard-2/gradle-build.log
          exit $GRADLE_EXIT
      - name: Run emulator tests shard 2
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          ram: 4096
          script: |
            set +e
            echo "=== Emulator test shard 2 started ===" | tee ci-logs/emulator-shard-2/emulator-test.log
            adb wait-for-device 2>&1 | tee -a ci-logs/emulator-shard-2/emulator-test.log
            echo "--- Clear logcat ---" | tee -a ci-logs/emulator-shard-2/emulator-test.log
            adb logcat -c 2>/dev/null || true
            echo "--- Install debug APK ---" | tee -a ci-logs/emulator-shard-2/emulator-test.log
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee -a ci-logs/emulator-shard-2/emulator-test.log
            echo "--- Install androidTest APK ---" | tee -a ci-logs/emulator-shard-2/emulator-test.log
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk 2>&1 | tee -a ci-logs/emulator-shard-2/emulator-test.log
            echo "--- Run instrumentation tests ---" | tee -a ci-logs/emulator-shard-2/emulator-test.log
            adb shell am instrument -w -e package app.onedoc.performance app.onedoc.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee -a ci-logs/emulator-shard-2/emulator-test.log
            TEST_EXIT=$?
            echo "Test exit code: $TEST_EXIT" | tee -a ci-logs/emulator-shard-2/emulator-test.log
            echo "--- Capture screenshots ---" | tee -a ci-logs/emulator-shard-2/emulator-test.log
            mkdir -p app/build/outputs/screenshots
            adb shell screencap -p /sdcard/onedoc_shard2_perf.png 2>/dev/null || true
            adb pull /sdcard/onedoc_shard2_perf.png app/build/outputs/screenshots/shard2_perf.png 2>/dev/null || true
            SCREENSHOT_COUNT=$(ls app/build/outputs/screenshots/*.png 2>/dev/null | wc -l)
            echo "Captured $SCREENSHOT_COUNT screenshots for shard 2" | tee -a ci-logs/emulator-shard-2/emulator-test.log
            echo "--- Capture logcat ---" | tee -a ci-logs/emulator-shard-2/emulator-test.log
            adb logcat -d > app/build/outputs/screenshots/logcat-shard2.txt 2>/dev/null || true
            cp app/build/outputs/screenshots/logcat-shard2.txt ci-logs/emulator-shard-2/logcat-shard2.txt 2>/dev/null || true
            echo "=== Emulator test shard 2 finished (exit $TEST_EXIT) ===" | tee -a ci-logs/emulator-shard-2/emulator-test.log
            exit $TEST_EXIT
      - name: Upload screenshots shard 2
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-shard-2
          path: app/build/outputs/screenshots/**/*.png
          retention-days: 30
          if-no-files-found: warn
      - name: Upload logcat shard 2
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat-shard-2
          path: app/build/outputs/screenshots/logcat-shard2.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Upload emulator-shard-2 logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-emulator-shard-2
          path: ci-logs/emulator-shard-2/
          retention-days: 30
          if-no-files-found: warn

  screenshots-pdf:
    name: Generate screenshot PDF report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [emulator-test-shard-1, emulator-test-shard-2]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Setup log directory
        run: mkdir -p ci-logs/screenshots-pdf
      - name: Download screenshots shard 1
        uses: actions/download-artifact@v4
        with:
          name: screenshots-shard-1
          path: screenshots/shard-1
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Download screenshots shard 2
        uses: actions/download-artifact@v4
        with:
          name: screenshots-shard-2
          path: screenshots/shard-2
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Generate PDF report
        run: |
          set +e
          echo "=== Screenshot PDF report generation ===" | tee ci-logs/screenshots-pdf/pdf-report.log
          mkdir -p screenshots/combined
          cp screenshots/shard-1/*.png screenshots/combined/ 2>/dev/null || true
          cp screenshots/shard-2/*.png screenshots/combined/ 2>/dev/null || true
          SCREENSHOT_COUNT=$(ls screenshots/combined/*.png 2>/dev/null 2>&1 | wc -l)
          echo "Total screenshots for PDF: $SCREENSHOT_COUNT" | tee -a ci-logs/screenshots-pdf/pdf-report.log
          if [ "$SCREENSHOT_COUNT" -eq 0 ]; then
            echo "::warning::No screenshots available — creating text report" | tee -a ci-logs/screenshots-pdf/pdf-report.log
            echo "OneDoc CI Screenshot Report" > onedoc-screenshot-report.txt
            echo "=============================" >> onedoc-screenshot-report.txt
            echo "" >> onedoc-screenshot-report.txt
            echo "No screenshots were captured during this CI run." >> onedoc-screenshot-report.txt
            echo "CI job statuses: See GitHub Actions run for actual test results." >> onedoc-screenshot-report.txt
            echo "" >> onedoc-screenshot-report.txt
            echo "Screenshots captured: $SCREENSHOT_COUNT" >> onedoc-screenshot-report.txt
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick 2>/dev/null || true
            cd screenshots/combined
            convert *.png ../../onedoc-screenshot-report.pdf 2>/dev/null || {
              cd ../..
              echo "ImageMagick convert failed — creating text report instead" | tee -a ci-logs/screenshots-pdf/pdf-report.log
              echo "OneDoc CI Screenshot Report" > onedoc-screenshot-report.txt
              echo "=============================" >> onedoc-screenshot-report.txt
              echo "" >> onedoc-screenshot-report.txt
              echo "Captured $SCREENSHOT_COUNT screenshot(s):" >> onedoc-screenshot-report.txt
              ls screenshots/combined/*.png >> onedoc-screenshot-report.txt
            }
            cd ../.. 2>/dev/null || true
          fi
          echo "=== PDF report generation finished ===" | tee -a ci-logs/screenshots-pdf/pdf-report.log
      - name: Upload screenshot PDF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-screenshot-report
          path: onedoc-screenshot-report.*
          retention-days: 30
          if-no-files-found: warn
      - name: Upload screenshots-pdf logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-screenshots-pdf
          path: ci-logs/screenshots-pdf/
          retention-days: 30
          if-no-files-found: warn

  verify-ci-lane:
    name: CI lane green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [traceability, build-debug, build-release, emulator-test-shard-1, emulator-test-shard-2]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Setup log directory
        run: mkdir -p ci-logs/verify-ci-lane
      - name: Validate CI lane status
        run: |
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job statuses: $statuses" | tee ci-logs/verify-ci-lane/ci-lane-status.log
          echo "Run ID: $GITHUB_RUN_ID" | tee -a ci-logs/verify-ci-lane/ci-lane-status.log
          echo "Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | tee -a ci-logs/verify-ci-lane/ci-lane-status.log
          if echo "$statuses" | grep -q 'failure'; then echo 'CI lane not green' | tee -a ci-logs/verify-ci-lane/ci-lane-status.log; exit 1; fi
          echo 'PASS: CI lane green' | tee -a ci-logs/verify-ci-lane/ci-lane-status.log
      - name: Upload verify-ci-lane logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-verify-ci-lane
          path: ci-logs/verify-ci-lane/
          retention-days: 30
          if-no-files-found: warn
