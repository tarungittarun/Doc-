name: OneDoc Android CI

on:
  push:
    branches: ["arena/db667982-doc"]
  pull_request:
    branches: ["arena/db667982-doc"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Traceability check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tool deps
        run: python3 -m pip -q install pyyaml
      - name: Run traceability check
        run: python3 tools/onedoc/traceability.py --check --strict

  build-debug:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [traceability]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - name: List SDK platforms
        run: echo "::notice::PLATFORMS:$(ls $ANDROID_HOME/platforms/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')"
      - name: List SDK build-tools
        run: echo "::notice::BUILD_TOOLS:$(ls $ANDROID_HOME/build-tools/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')"
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
      - name: Gradle version
        run: |
          echo "::notice::GRADLE_VERSION: $(gradle --version 2>&1 | grep 'Gradle ' | head -1)"
          gradle --version
      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon --stacktrace -Dkotlin.compiler.execution.strategy=in-process --no-build-cache assembleFullDebug 2>&1 | tee /tmp/gradle-debug.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "::notice::GRADLE_EXIT=$GRADLE_EXIT"
          grep -iE 'error:|error |FAILED|exception|caused by|unresolved|not found|cannot|what went wrong|could not|compile|execution failed' /tmp/gradle-debug.log 2>/dev/null | head -20 | while read line; do echo "::notice::GRADLE_ERR: $line"; done
          exit $GRADLE_EXIT
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  build-release:
    name: Build release APKs + static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gradle 8.10.2
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - name: List SDK platforms
        run: echo "::notice::PLATFORMS:$(ls $ANDROID_HOME/platforms/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')"
      - name: List SDK build-tools
        run: echo "::notice::BUILD_TOOLS:$(ls $ANDROID_HOME/build-tools/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')"
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
      - name: Gradle version
        run: |
          echo "::notice::GRADLE_VERSION: $(gradle --version 2>&1 | grep 'Gradle ' | head -1)"
          gradle --version
      - name: Build release APK
        run: gradle --no-daemon --stacktrace -Dkotlin.compiler.execution.strategy=in-process --no-build-cache assembleFullRelease
      - name: "Static gate: no internet permission"
        run: |
          if grep -rqi 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'FAIL: internet permission present'; exit 1; fi
          if grep -rqi 'ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml; then echo 'FAIL: network permission present'; exit 1; fi
          echo 'PASS: no internet permission'
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-release-apks
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  verify-ci-lane:
    name: CI lane green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [traceability, build-debug, build-release]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: |
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job statuses: $statuses"
          if echo "$statuses" | grep -q 'failure'; then echo 'CI lane not green'; exit 1; fi
          echo 'PASS: CI lane green'
