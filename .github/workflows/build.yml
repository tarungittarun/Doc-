name: OneDoc Android CI

on:
  push:
    branches: ["arena/db667982-doc"]
  pull_request:
    branches: ["arena/db667982-doc"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Traceability check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run traceability check
        run: python3 tools/onedoc/traceability.py --check --strict

  build-debug:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [traceability]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup log directory
        run: mkdir -p ci-logs/build-debug
      - name: Install Gradle 8.10.2
        run: |
          set -o pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip 2>&1 | tee ci-logs/build-debug/gradle-download.log
          curl_exit=${PIPESTATUS[0]}
          test $curl_exit -eq 0 || { echo "::error::Gradle download failed (exit $curl_exit)"; exit 1; }
          unzip -q /tmp/gradle.zip -d /opt 2>&1 | tee -a ci-logs/build-debug/gradle-download.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::Gradle unzip failed"; exit 1; }
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
          echo "Gradle installed successfully" | tee -a ci-logs/build-debug/gradle-download.log
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate JDK 21
        run: |
          java -version 2>&1 | tee ci-logs/build-debug/jdk-version.log
          java_version=$(java -version 2>&1 | head -1)
          echo "$java_version" | grep -q "21" || { echo "::error::JDK 21 not found: $java_version"; exit 1; }
          echo "JDK 21 validated" | tee -a ci-logs/build-debug/jdk-version.log
      - name: List SDK platforms
        run: |
          echo "::notice::PLATFORMS:$(ls $ANDROID_HOME/platforms/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')" | tee ci-logs/build-debug/sdk-platforms.log
          test -d "$ANDROID_HOME/platforms" || { echo "::error::ANDROID_HOME/platforms not found at $ANDROID_HOME/platforms"; exit 1; }
      - name: List SDK build-tools
        run: |
          echo "::notice::BUILD_TOOLS:$(ls $ANDROID_HOME/build-tools/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')" | tee ci-logs/build-debug/sdk-build-tools.log
          test -d "$ANDROID_HOME/build-tools" || { echo "::error::ANDROID_HOME/build-tools not found at $ANDROID_HOME/build-tools"; exit 1; }
      - name: Install missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 | tee ci-logs/build-debug/sdk-licenses.log || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee ci-logs/build-debug/sdk-install.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::SDK package install failed"; exit 1; }
      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          cat local.properties | tee ci-logs/build-debug/local-properties.log
          test -s local.properties || { echo "::error::local.properties is empty"; exit 1; }
      - name: Restore debug keystore from previous run (for same-app updates)
        id: restore-keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "Keystore already exists in repo" | tee ci-logs/build-debug/keystore-restore.log
            echo "keystore_exists=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore in repo, will generate one" | tee ci-logs/build-debug/keystore-restore.log
            echo "keystore_exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create debug keystore for release signing
        if: steps.restore-keystore.outputs.keystore_exists == 'false'
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=OneDoc Debug,O=OneDoc,C=US" -keyalg RSA -keysize 2048 -validity 10000 2>&1 | tee ci-logs/build-debug/keystore-create.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::keystore generation failed"; exit 1; }
          ls -l debug.keystore | tee -a ci-logs/build-debug/keystore-create.log
      - name: Commit keystore to repo for same-app updates
        if: steps.restore-keystore.outputs.keystore_exists == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add debug.keystore
          git commit -m "chore: Add debug keystore for same-app updates" 2>&1 | tee ci-logs/build-debug/keystore-commit.log
          git push 2>&1 | tee -a ci-logs/build-debug/keystore-commit.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::keystore commit/push failed"; exit 1; }
      - name: Gradle version
        run: |
          gradle --version 2>&1 | tee ci-logs/build-debug/gradle-version.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::gradle --version failed"; exit 1; }
      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon --stacktrace --max-workers=1 -Dkotlin.daemon.enabled=false --info assembleDebug 2>&1 | tee ci-logs/build-debug/gradle-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "::notice::GRADLE_EXIT=$GRADLE_EXIT"
          echo "::notice::GRADLE_LOG_SIZE=$(wc -c < ci-logs/build-debug/gradle-build.log)"
          echo "--- Key errors ---" | tee -a ci-logs/build-debug/gradle-build.log
          grep -E '^(e:|Execution failed|FAILED|Exception|Caused by|Error:|Could not|What went wrong)' ci-logs/build-debug/gradle-build.log 2>/dev/null | head -60 | while read line; do echo "::notice::GRADLE_KEY: $line"; done
          echo "--- Last 100 lines ---" | tee -a ci-logs/build-debug/gradle-build.log
          tail -100 ci-logs/build-debug/gradle-build.log | while read line; do echo "::notice::GRADLE_TAIL: $line"; done
          echo "Build debug exit code: $GRADLE_EXIT" | tee -a ci-logs/build-debug/gradle-build.log
          exit $GRADLE_EXIT
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-debug-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
      - name: Upload debug keystore for same-app updates
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-keystore
          path: debug.keystore
          retention-days: 90
          if-no-files-found: warn
      - name: Upload build-debug logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-build-debug
          path: ci-logs/build-debug/
          retention-days: 30
          if-no-files-found: warn

  build-release:
    name: Build release APKs + static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup log directory
        run: mkdir -p ci-logs/build-release
      - name: Install Gradle 8.10.2
        run: |
          set -o pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip 2>&1 | tee ci-logs/build-release/gradle-download.log
          curl_exit=${PIPESTATUS[0]}
          test $curl_exit -eq 0 || { echo "::error::Gradle download failed (exit $curl_exit)"; exit 1; }
          unzip -q /tmp/gradle.zip -d /opt 2>&1 | tee -a ci-logs/build-release/gradle-download.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::Gradle unzip failed"; exit 1; }
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
          echo "Gradle installed successfully" | tee -a ci-logs/build-release/gradle-download.log
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate JDK 21
        run: |
          java -version 2>&1 | tee ci-logs/build-release/jdk-version.log
          java_version=$(java -version 2>&1 | head -1)
          echo "$java_version" | grep -q "21" || { echo "::error::JDK 21 not found: $java_version"; exit 1; }
          echo "JDK 21 validated" | tee -a ci-logs/build-release/jdk-version.log
      - name: List SDK platforms
        run: |
          echo "::notice::PLATFORMS:$(ls $ANDROID_HOME/platforms/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')" | tee ci-logs/build-release/sdk-platforms.log
          test -d "$ANDROID_HOME/platforms" || { echo "::error::ANDROID_HOME/platforms not found"; exit 1; }
      - name: List SDK build-tools
        run: |
          echo "::notice::BUILD_TOOLS:$(ls $ANDROID_HOME/build-tools/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')" | tee ci-logs/build-release/sdk-build-tools.log
          test -d "$ANDROID_HOME/build-tools" || { echo "::error::ANDROID_HOME/build-tools not found"; exit 1; }
      - name: Install missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 | tee ci-logs/build-release/sdk-licenses.log || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee ci-logs/build-release/sdk-install.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::SDK package install failed"; exit 1; }
      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          cat local.properties | tee ci-logs/build-release/local-properties.log
          test -s local.properties || { echo "::error::local.properties is empty"; exit 1; }
      - name: Restore debug keystore from same run (build-debug)
        uses: actions/download-artifact@v4
        id: restore-keystore-same-run
        with:
          name: debug-keystore
          path: .
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Restore debug keystore from latest successful run (cross-run persistence)
        if: steps.restore-keystore-same-run.outcome != 'success'
        id: restore-keystore-cross-run
        run: |
          echo "Attempting cross-run keystore restore..." | tee ci-logs/build-release/keystore-restore.log
          LATEST_RUN=$(gh api repos/$GITHUB_REPOSITORY/actions/runs -q '.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and .head_branch == "arena/db667982-doc") | .[0].id' 2>/dev/null || echo "")
          echo "Latest successful run: $LATEST_RUN" | tee -a ci-logs/build-release/keystore-restore.log
          if [ -n "$LATEST_RUN" ] && [ "$LATEST_RUN" != "$GITHUB_RUN_ID" ]; then
            ARTIFACT_URL=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$LATEST_RUN/artifacts -q '.artifacts[] | select(.name == "debug-keystore") | .archive_download_url' 2>/dev/null || echo "")
            if [ -n "$ARTIFACT_URL" ]; then
              gh api -X GET "$ARTIFACT_URL" -H 'Accept: application/zip' > /tmp/keystore.zip 2>/dev/null && unzip -o /tmp/keystore.zip -d . && echo "Restored keystore from run $LATEST_RUN" | tee -a ci-logs/build-release/keystore-restore.log && echo "keystore_restored=true" >> $GITHUB_OUTPUT && exit 0
            fi
          fi
          echo "keystore_restored=false" >> $GITHUB_OUTPUT
          echo "Cross-run keystore restore failed or not available" | tee -a ci-logs/build-release/keystore-restore.log
      - name: Create debug keystore if not restored
        if: steps.restore-keystore-same-run.outcome != 'success' && steps.restore-keystore-cross-run.outputs.keystore_restored != 'true'
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=OneDoc Debug,O=OneDoc,C=US" -keyalg RSA -keysize 2048 -validity 10000 2>&1 | tee ci-logs/build-release/keystore-create.log
            test ${PIPESTATUS[0]} -eq 0 || { echo "::error::keystore generation failed"; exit 1; }
            ls -l debug.keystore | tee -a ci-logs/build-release/keystore-create.log
          else
            echo "debug.keystore already present from repo checkout — preserving same-app signing key" | tee ci-logs/build-release/keystore-create.log
          fi
      - name: Gradle version
        run: |
          gradle --version 2>&1 | tee ci-logs/build-release/gradle-version.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::gradle --version failed"; exit 1; }
      - name: Build release APK
        run: |
          set +e
          gradle --no-daemon --stacktrace --max-workers=1 -Dkotlin.daemon.enabled=false --info assembleRelease 2>&1 | tee ci-logs/build-release/gradle-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "::notice::GRADLE_EXIT=$GRADLE_EXIT"
          echo "::notice::GRADLE_LOG_SIZE=$(wc -c < ci-logs/build-release/gradle-build.log)"
          echo "--- Key errors ---" | tee -a ci-logs/build-release/gradle-build.log
          grep -E '^(e:|Execution failed|FAILED|Exception|Caused by|Error:|Could not|What went wrong)' ci-logs/build-release/gradle-build.log 2>/dev/null | head -60 | while read line; do echo "::notice::GRADLE_KEY: $line"; done
          echo "--- Last 100 lines ---" | tee -a ci-logs/build-release/gradle-build.log
          tail -100 ci-logs/build-release/gradle-build.log | while read line; do echo "::notice::GRADLE_TAIL: $line"; done
          echo "Build release exit code: $GRADLE_EXIT" | tee -a ci-logs/build-release/gradle-build.log
          exit $GRADLE_EXIT
      - name: "Static gate: no internet permission"
        run: |
          if grep -rqi 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'FAIL: internet permission present' | tee ci-logs/build-release/static-gate.log; exit 1; fi
          if grep -rqi 'ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml; then echo 'FAIL: network permission present' | tee -a ci-logs/build-release/static-gate.log; exit 1; fi
          echo 'PASS: no internet permission' | tee ci-logs/build-release/static-gate.log
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedoc-release-apks
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 30
          if-no-files-found: warn
      - name: Upload build-release logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-build-release
          path: ci-logs/build-release/
          retention-days: 30
          if-no-files-found: warn

  emulator-test-shard-1:
    name: Emulator tests shard 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup log directory
        run: mkdir -p ci-logs/emulator-shard-1 app/build/outputs/screenshots
      - name: Install Gradle 8.10.2
        run: |
          set -o pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip 2>&1 | tee ci-logs/emulator-shard-1/gradle-download.log
          curl_exit=${PIPESTATUS[0]}
          test $curl_exit -eq 0 || { echo "::error::Gradle download failed (exit $curl_exit)"; exit 1; }
          unzip -q /tmp/gradle.zip -d /opt 2>&1 | tee -a ci-logs/emulator-shard-1/gradle-download.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::Gradle unzip failed"; exit 1; }
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
          echo "Gradle installed successfully" | tee -a ci-logs/emulator-shard-1/gradle-download.log
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: List SDK platforms
        run: |
          echo "::notice::PLATFORMS:$(ls $ANDROID_HOME/platforms/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')" | tee ci-logs/emulator-shard-1/sdk-platforms.log
          test -d "$ANDROID_HOME/platforms" || { echo "::error::ANDROID_HOME/platforms not found"; exit 1; }
      - name: List SDK build-tools
        run: |
          echo "::notice::BUILD_TOOLS:$(ls $ANDROID_HOME/build-tools/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')" | tee ci-logs/emulator-shard-1/sdk-build-tools.log
          test -d "$ANDROID_HOME/build-tools" || { echo "::error::ANDROID_HOME/build-tools not found"; exit 1; }
      - name: Install missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 | tee ci-logs/emulator-shard-1/sdk-licenses.log || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee ci-logs/emulator-shard-1/sdk-install.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::SDK package install failed"; exit 1; }
      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          cat local.properties | tee ci-logs/emulator-shard-1/local-properties.log
      - name: Build debug + test APKs
        run: |
          set +e
          /opt/gradle-8.10.2/bin/gradle --no-daemon --max-workers=1 --stacktrace assembleDebug assembleDebugAndroidTest 2>&1 | tee ci-logs/emulator-shard-1/gradle-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "::notice::GRADLE_EXIT=$GRADLE_EXIT"
          grep -E '^(e:|Execution failed|FAILED|Exception|Caused by|Error:|Could not|What went wrong)' ci-logs/emulator-shard-1/gradle-build.log 2>/dev/null | head -60 | while read line; do echo "::notice::GRADLE_KEY: $line"; done
          echo "Build debug+test exit code: $GRADLE_EXIT" | tee -a ci-logs/emulator-shard-1/gradle-build.log
          exit $GRADLE_EXIT
      - name: Run emulator tests shard 1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          ram: 4096
          script: |
            set +e
            echo "=== Emulator test shard 1 started ===" | tee ci-logs/emulator-shard-1/emulator-test.log
            adb wait-for-device 2>&1 | tee -a ci-logs/emulator-shard-1/emulator-test.log
            echo "--- Clear logcat ---" | tee -a ci-logs/emulator-shard-1/emulator-test.log
            adb logcat -c 2>/dev/null || true
            echo "--- Install debug APK ---" | tee -a ci-logs/emulator-shard-1/emulator-test.log
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee -a ci-logs/emulator-shard-1/emulator-test.log
            echo "--- Install androidTest APK ---" | tee -a ci-logs/emulator-shard-1/emulator-test.log
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk 2>&1 | tee -a ci-logs/emulator-shard-1/emulator-test.log
            echo "--- Run instrumentation tests ---" | tee -a ci-logs/emulator-shard-1/emulator-test.log
            adb shell am instrument -w -e package app.onedoc.home app.onedoc.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee -a ci-logs/emulator-shard-1/emulator-test.log
            TEST_EXIT=$?
            echo "Test exit code: $TEST_EXIT" | tee -a ci-logs/emulator-shard-1/emulator-test.log
            echo "--- Capture screenshots ---" | tee -a ci-logs/emulator-shard-1/emulator-test.log
            mkdir -p app/build/outputs/screenshots
            adb shell screencap -p /sdcard/onedoc_shard1_home.png 2>/dev/null || true
            adb pull /sdcard/onedoc_shard1_home.png app/build/outputs/screenshots/shard1_home.png 2>/dev/null || true
            sleep 2
            adb shell input tap 200 500 2>/dev/null || true
            sleep 2
            adb shell screencap -p /sdcard/onedoc_shard1_editor.png 2>/dev/null || true
            adb pull /sdcard/onedoc_shard1_editor.png app/build/outputs/screenshots/shard1_editor.png 2>/dev/null || true
            SCREENSHOT_COUNT=$(ls app/build/outputs/screenshots/*.png 2>/dev/null | wc -l)
            echo "Captured $SCREENSHOT_COUNT screenshots for shard 1" | tee -a ci-logs/emulator-shard-1/emulator-test.log
            echo "--- Capture logcat ---" | tee -a ci-logs/emulator-shard-1/emulator-test.log
            adb logcat -d > app/build/outputs/screenshots/logcat-shard1.txt 2>/dev/null || true
            cp app/build/outputs/screenshots/logcat-shard1.txt ci-logs/emulator-shard-1/logcat-shard1.txt 2>/dev/null || true
            echo "=== Emulator test shard 1 finished (exit $TEST_EXIT) ===" | tee -a ci-logs/emulator-shard-1/emulator-test.log
            exit $TEST_EXIT
      - name: Upload screenshots shard 1
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-shard-1
          path: app/build/outputs/screenshots/**/*.png
          retention-days: 30
          if-no-files-found: warn
      - name: Upload logcat shard 1
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat-shard-1
          path: app/build/outputs/screenshots/logcat-shard1.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Upload emulator-shard-1 logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-emulator-shard-1
          path: ci-logs/emulator-shard-1/
          retention-days: 30
          if-no-files-found: warn

