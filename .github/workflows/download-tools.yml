name: Download and Chunk Build Tools

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-chunk:
    name: Download, extract, and chunk build tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create directories
        run: |
          mkdir -p tools/chunks/gradle tools/chunks/android-sdk tools/scripts

      - name: Download Gradle 8.10.2
        run: |
          cd /tmp
          curl -fsSL --max-time 120 -o gradle-8.10.2-bin.zip "https://services.gradle.org/distributions/gradle-8.10.2-bin.zip"
          ls -la gradle-8.10.2-bin.zip

      - name: Extract Gradle
        run: |
          cd /tmp
          mkdir -p gradle-extract
          unzip -q gradle-8.10.2-bin.zip -d gradle-extract
          cd gradle-extract/gradle-8.10.2
          tar -cf /tmp/gradle.tar .
          ls -la /tmp/gradle.tar

      - name: Split Gradle into chunks
        run: |
          cd /tmp
          split -b 48M -d gradle.tar $GITHUB_WORKSPACE/tools/chunks/gradle/gradle.tar.part.
          ls -la $GITHUB_WORKSPACE/tools/chunks/gradle/
          echo "Chunk count: $(ls $GITHUB_WORKSPACE/tools/chunks/gradle/ | wc -l)"
          sha256sum $GITHUB_WORKSPACE/tools/chunks/gradle/* > $GITHUB_WORKSPACE/tools/chunks/gradle.sha256

      - name: Download Android SDK cmdline-tools
        run: |
          cd /tmp
          curl -fsSL --max-time 120 -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          ls -la cmdline-tools.zip

      - name: Extract and setup Android SDK
        run: |
          cd /tmp
          mkdir -p android-sdk-extract/cmdline-tools
          unzip -q cmdline-tools.zip -d android-sdk-extract/cmdline-tools
          mkdir -p android-sdk-extract/cmdline-tools/latest
          mv android-sdk-extract/cmdline-tools/bin android-sdk-extract/cmdline-tools/latest/ 2>/dev/null || true
          mv android-sdk-extract/cmdline-tools/lib android-sdk-extract/cmdline-tools/latest/ 2>/dev/null || true
          export ANDROID_HOME=/tmp/android-sdk-extract
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_HOME/"
          cd "$ANDROID_HOME"
          tar -cf /tmp/android-sdk.tar .
          ls -la /tmp/android-sdk.tar

      - name: Split Android SDK into chunks
        run: |
          cd /tmp
          split -b 48M -d android-sdk.tar $GITHUB_WORKSPACE/tools/chunks/android-sdk/android-sdk.tar.part.
          ls -la $GITHUB_WORKSPACE/tools/chunks/android-sdk/
          echo "Chunk count: $(ls $GITHUB_WORKSPACE/tools/chunks/android-sdk/ | wc -l)"
          sha256sum $GITHUB_WORKSPACE/tools/chunks/android-sdk/* > $GITHUB_WORKSPACE/tools/chunks/android-sdk.sha256

      - name: Generate reassembly script
        run: |
          cat > tools/scripts/reassemble-tools.sh <<'REASSEMBLE_SCRIPT'
          #!/bin/bash
          set -e
          INSTALL_DIR="${HOME}/onedoc-tools"
          REPO_DIR="$(cd "$(dirname "$0")/../.." && pwd)"
          CHUNKS_DIR="${REPO_DIR}/tools/chunks"
          echo "=== OneDoc Tool Reassembly ==="
          echo "[1/2] Reassembling Gradle 8.10.2..."
          mkdir -p "${INSTALL_DIR}/gradle"
          cat "${CHUNKS_DIR}/gradle/"gradle.tar.part.* > /tmp/gradle.tar
          tar -xf /tmp/gradle.tar -C "${INSTALL_DIR}/gradle" --strip-components=1
          rm -f /tmp/gradle.tar
          echo "[2/2] Reassembling Android SDK..."
          mkdir -p "${INSTALL_DIR}/android-sdk"
          cat "${CHUNKS_DIR}/android-sdk/"android-sdk.tar.part.* > /tmp/android-sdk.tar
          tar -xf /tmp/android-sdk.tar -C "${INSTALL_DIR}/android-sdk" --strip-components=1
          rm -f /tmp/android-sdk.tar
          echo "=== Reassembly Complete ==="
          echo "export ANDROID_HOME=${INSTALL_DIR}/android-sdk"
          echo "export GRADLE_HOME=${INSTALL_DIR}/gradle/gradle-8.10.2"
          echo "export PATH=\${GRADLE_HOME}/bin:\${ANDROID_HOME}/platform-tools:\${PATH}"
          REASSEMBLE_SCRIPT
          chmod +x tools/scripts/reassemble-tools.sh

      - name: Create chunk manifest
        run: |
          GRADLE_CHUNKS=$(ls tools/chunks/gradle/ 2>/dev/null | wc -l)
          ANDROID_CHUNKS=$(ls tools/chunks/android-sdk/ 2>/dev/null | wc -l)
          cat > tools/chunks/CHUNKS.md <<EOF
          # OneDoc Tool Chunks

          Build tools are split into 48MB chunks for git storage.
          Reassemble with: bash tools/scripts/reassemble-tools.sh

          | Tool | Chunks | Approx Size |
          |------|--------|-------------|
          | Gradle 8.10.2 | ${GRADLE_CHUNKS} | ~200MB |
          | Android SDK 34 | ${ANDROID_CHUNKS} | ~500MB+ |

          ## Reassembly

          ```bash
          bash tools/scripts/reassemble-tools.sh
          ```

          Then set environment variables and build:

          ```bash
          export GRADLE_HOME=~/onedoc-tools/gradle/gradle-8.10.2
          export ANDROID_HOME=~/onedoc-tools/android-sdk
          export PATH=\$GRADLE_HOME/bin:\$ANDROID_HOME/platform-tools:\$PATH

          cd /path/to/Doc-
          ./gradlew assembleRelease
          ```

          ## Pre-built APK

          OneDoc-release.apk is committed to repo root.
          EOF

      - name: Commit chunks to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tools/chunks/ tools/scripts/reassemble-tools.sh
          git commit -m "chore: Commit chunked build tools [skip ci]"
          git push
          echo "Tool chunks committed"

      - name: Upload chunk logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-chunk-tools
          path: tools/scripts/
          retention-days: 30
          if-no-files-found: warn
