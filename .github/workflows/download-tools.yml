name: Download and Chunk Build Tools

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-chunk:
    name: Download, extract, and chunk build tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create directories
        run: |
          mkdir -p tools/chunks/java17 tools/chunks/gradle tools/chunks/android-sdk tools/scripts

      - name: Download Java 17 (Temurin)
        run: |
          cd /tmp
          curl -fsSL --max-time 120 -o openjdk-17.tar.gz "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.11%2B9/OpenJDK17U-jdk_x64_linux_hotspot_17.0.11_9.tar.gz" || echo "Java 17 download failed from GitHub"
          ls -la openjdk-17.tar.gz 2>/dev/null || echo "No Java 17 file"

      - name: Extract and chunk Java 17
        run: |
          cd /tmp
          if [ -f openjdk-17.tar.gz ]; then
            mkdir -p java17-extract
            tar -xzf openjdk-17.tar.gz -C java17-extract --strip-components=1
            cd java17-extract
            tar -cf /tmp/java17.tar .
            cd /tmp
            split -b 48M -d java17.tar $GITHUB_WORKSPACE/tools/chunks/java17/java17.tar.part.
            echo "Java 17 chunk count: $(ls $GITHUB_WORKSPACE/tools/chunks/java17/ 2>/dev/null | wc -l)"
            sha256sum $GITHUB_WORKSPACE/tools/chunks/java17/* > $GITHUB_WORKSPACE/tools/chunks/java17.sha256 2>/dev/null || true
          else
            echo "Skipping Java 17 chunks - no file downloaded"
          fi

      - name: Download Gradle 8.10.2
        run: |
          cd /tmp
          curl -fsSL --max-time 120 -o gradle-8.10.2-bin.zip "https://services.gradle.org/distributions/gradle-8.10.2-bin.zip"
          ls -la gradle-8.10.2-bin.zip

      - name: Extract Gradle
        run: |
          cd /tmp
          mkdir -p gradle-extract
          unzip -q gradle-8.10.2-bin.zip -d gradle-extract
          cd gradle-extract/gradle-8.10.2
          tar -cf /tmp/gradle.tar .
          ls -la /tmp/gradle.tar

      - name: Split Gradle into chunks
        run: |
          cd /tmp
          split -b 48M -d gradle.tar $GITHUB_WORKSPACE/tools/chunks/gradle/gradle.tar.part.
          echo "Gradle chunk count: $(ls $GITHUB_WORKSPACE/tools/chunks/gradle/ | wc -l)"
          sha256sum $GITHUB_WORKSPACE/tools/chunks/gradle/* > $GITHUB_WORKSPACE/tools/chunks/gradle.sha256

      - name: Download Android SDK cmdline-tools
        run: |
          cd /tmp
          curl -fsSL --max-time 120 -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" || echo "Android SDK download failed"
          ls -la cmdline-tools.zip 2>/dev/null || echo "No Android SDK file"

      - name: Extract and chunk Android SDK
        run: |
          cd /tmp
          if [ -f cmdline-tools.zip ]; then
            mkdir -p android-sdk-extract
            unzip -q cmdline-tools.zip -d android-sdk-extract
            cd android-sdk-extract
            tar -cf /tmp/android-sdk.tar .
            split -b 48M -d android-sdk.tar $GITHUB_WORKSPACE/tools/chunks/android-sdk/android-sdk.tar.part.
            echo "Android SDK chunk count: $(ls $GITHUB_WORKSPACE/tools/chunks/android-sdk/ 2>/dev/null | wc -l)"
            sha256sum $GITHUB_WORKSPACE/tools/chunks/android-sdk/* > $GITHUB_WORKSPACE/tools/chunks/android-sdk.sha256 2>/dev/null || true
          else
            echo "Skipping Android SDK chunks - no file downloaded"
          fi

      - name: Generate reassembly script
        run: |
          cat > tools/scripts/reassemble-tools.sh <<'REASSEMBLE_SCRIPT'
          #!/bin/bash
          set -e
          INSTALL_DIR="${HOME}/onedoc-tools"
          REPO_DIR="$(cd "$(dirname "$0")/../.." && pwd)"
          CHUNKS_DIR="${REPO_DIR}/tools/chunks"
          echo "=== OneDoc Tool Reassembly ==="
          if compgen -G "${CHUNKS_DIR}/java17/java17.tar.part.*" > /dev/null 2>&1; then
            echo "[1/3] Reassembling Java 17..."
            mkdir -p "${INSTALL_DIR}/java17"
            cat "${CHUNKS_DIR}/java17/java17.tar.part.*" > /tmp/java17.tar
            tar -xf /tmp/java17.tar -C "${INSTALL_DIR}/java17" --strip-components=1
            rm -f /tmp/java17.tar
            echo "export JAVA_HOME=${INSTALL_DIR}/java17"
            echo "export PATH=\${JAVA_HOME}/bin:\${PATH}"
          else
            echo "Skipping Java 17 - no chunks found"
          fi
          if compgen -G "${CHUNKS_DIR}/gradle/gradle.tar.part.*" > /dev/null 2>&1; then
            echo "[2/3] Reassembling Gradle 8.10.2..."
            mkdir -p "${INSTALL_DIR}/gradle"
            cat "${CHUNKS_DIR}/gradle/gradle.tar.part.*" > /tmp/gradle.tar
            tar -xf /tmp/gradle.tar -C "${INSTALL_DIR}/gradle" --strip-components=1
            rm -f /tmp/gradle.tar
            echo "export GRADLE_HOME=${INSTALL_DIR}/gradle/gradle-8.10.2"
            echo "export PATH=\${GRADLE_HOME}/bin:\${PATH}"
          else
            echo "Skipping Gradle - no chunks found"
          fi
          if compgen -G "${CHUNKS_DIR}/android-sdk/android-sdk.tar.part.*" > /dev/null 2>&1; then
            echo "[3/3] Reassembling Android SDK..."
            mkdir -p "${INSTALL_DIR}/android-sdk"
            cat "${CHUNKS_DIR}/android-sdk/android-sdk.tar.part.*" > /tmp/android-sdk.tar
            tar -xf /tmp/android-sdk.tar -C "${INSTALL_DIR}/android-sdk" --strip-components=1
            rm -f /tmp/android-sdk.tar
            echo "export ANDROID_HOME=${INSTALL_DIR}/android-sdk"
            echo "export PATH=\${ANDROID_HOME}/platform-tools:\${PATH}"
          else
            echo "Skipping Android SDK - no chunks found"
          fi
          echo "=== Reassembly Complete ==="
          REASSEMBLE_SCRIPT
          chmod +x tools/scripts/reassemble-tools.sh

      - name: Create chunk manifest
        run: |
          JAVA_CHUNKS=$(ls tools/chunks/java17/ 2>/dev/null | wc -l)
          GRADLE_CHUNKS=$(ls tools/chunks/gradle/ 2>/dev/null | wc -l)
          ANDROID_CHUNKS=$(ls tools/chunks/android-sdk/ 2>/dev/null | wc -l)
          cat > tools/chunks/CHUNKS.md <<EOF
          # OneDoc Tool Chunks

          All build tools are split into 48MB chunks for git storage.
          Reassemble with: bash tools/scripts/reassemble-tools.sh

          | Tool | Chunks | Approx Size |
          |------|--------|-------------|
          | Java 17 (Temurin) | ${JAVA_CHUNKS} | ~190MB |
          | Gradle 8.10.2 | ${GRADLE_CHUNKS} | ~200MB |
          | Android SDK 34 | ${ANDROID_CHUNKS} | ~500MB+ |

          ## Reassembly

          ```bash
          bash tools/scripts/reassemble-tools.sh
          ```

          Then set environment variables and build:

          ```bash
          export JAVA_HOME=~/onedoc-tools/java17
          export GRADLE_HOME=~/onedoc-tools/gradle/gradle-8.10.2
          export ANDROID_HOME=~/onedoc-tools/android-sdk
          export PATH=\$JAVA_HOME/bin:\$GRADLE_HOME/bin:\$ANDROID_HOME/platform-tools:\$PATH

          cd /path/to/Doc-
          ./gradlew assembleRelease
          ```

          ## Pre-built APK

          OneDoc-release.apk is committed to repo root.
          EOF

      - name: Commit chunks to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tools/chunks/ tools/scripts/reassemble-tools.sh
          git commit -m "chore: Commit chunked build tools [skip ci]"
          git push
          echo "Tool chunks committed"

      - name: Upload chunk logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-chunk-tools
          path: tools/scripts/
          retention-days: 30
          if-no-files-found: warn
