name: Download and Chunk Build Tools

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-and-chunk:
    name: Download, extract, and chunk build tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show environment
        run: |
          echo "Runner: $(uname -a)"
          echo "Disk space: $(df -h / | tail -1)"
          echo "Tools: $(which curl tar split unzip sha256sum git)"

      - name: Create directories
        run: |
          mkdir -p tools/chunks/java17 tools/chunks/gradle tools/chunks/android-sdk tools/scripts
          echo "Directories created"
          ls -la tools/chunks/

      - name: Download Java 17 tarball
        run: |
          cd /tmp
          echo "Downloading Java 17..."
          curl -fsSL --max-time 120 -o openjdk-17.tar.gz "https://api.adoptium.net/v3/binary/version/17.0.11+9/linux/x64/jdk/hotspot/normal/eclipse?project=jdk"
          echo "Download complete, file size:"
          ls -la openjdk-17.tar.gz
          file openjdk-17.tar.gz

      - name: Extract Java 17
        run: |
          cd /tmp
          mkdir -p java17-extract
          tar -xzf openjdk-17.tar.gz -C java17-extract --strip-components=1
          echo "Java 17 extracted, contents:"
          ls java17-extract/ | head -10
          cd java17-extract
          tar -cf /tmp/java17.tar .
          echo "Java 17 tar size:"
          ls -la /tmp/java17.tar

      - name: Split Java 17 into chunks
        run: |
          cd /tmp
          split -b 48M -d java17.tar $GITHUB_WORKSPACE/tools/chunks/java17/java17.tar.part.
          echo "Java 17 chunks:"
          ls -la $GITHUB_WORKSPACE/tools/chunks/java17/
          echo "Chunk count: $(ls $GITHUB_WORKSPACE/tools/chunks/java17/ | wc -l)"
          sha256sum $GITHUB_WORKSPACE/tools/chunks/java17/* > $GITHUB_WORKSPACE/tools/chunks/java17.sha256

      - name: Download Gradle 8.10.2
        run: |
          cd /tmp
          echo "Downloading Gradle 8.10.2..."
          curl -fsSL --max-time 120 -o gradle-8.10.2-bin.zip "https://services.gradle.org/distributions/gradle-8.10.2-bin.zip"
          echo "Download complete:"
          ls -la gradle-8.10.2-bin.zip
          file gradle-8.10.2-bin.zip

      - name: Extract Gradle
        run: |
          cd /tmp
          mkdir -p gradle-extract
          unzip -q gradle-8.10.2-bin.zip -d gradle-extract
          echo "Gradle extracted:"
          ls gradle-extract/
          cd gradle-extract/gradle-8.10.2
          tar -cf /tmp/gradle.tar .
          echo "Gradle tar size:"
          ls -la /tmp/gradle.tar

      - name: Split Gradle into chunks
        run: |
          cd /tmp
          split -b 48M -d gradle.tar $GITHUB_WORKSPACE/tools/chunks/gradle/gradle.tar.part.
          echo "Gradle chunks:"
          ls -la $GITHUB_WORKSPACE/tools/chunks/gradle/
          echo "Chunk count: $(ls $GITHUB_WORKSPACE/tools/chunks/gradle/ | wc -l)"
          sha256sum $GITHUB_WORKSPACE/tools/chunks/gradle/* > $GITHUB_WORKSPACE/tools/chunks/gradle.sha256

      - name: Download Android SDK cmdline-tools
        run: |
          cd /tmp
          echo "Downloading Android SDK cmdline-tools..."
          curl -fsSL --max-time 120 -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          echo "Download complete:"
          ls -la cmdline-tools.zip
          file cmdline-tools.zip

      - name: Extract and setup Android SDK
        run: |
          cd /tmp
          mkdir -p android-sdk-extract/cmdline-tools
          unzip -q cmdline-tools.zip -d android-sdk-extract/cmdline-tools
          mkdir -p android-sdk-extract/cmdline-tools/latest
          mv android-sdk-extract/cmdline-tools/bin android-sdk-extract/cmdline-tools/latest/ 2>/dev/null || true
          mv android-sdk-extract/cmdline-tools/lib android-sdk-extract/cmdline-tools/latest/ 2>/dev/null || true
          export ANDROID_HOME=/tmp/android-sdk-extract
          echo "Accepting licenses..."
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          echo "Installing SDK 34 packages..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "SDK installed, contents:"
          ls "$ANDROID_HOME/"
          cd "$ANDROID_HOME"
          tar -cf /tmp/android-sdk.tar .
          echo "Android SDK tar size:"
          ls -la /tmp/android-sdk.tar

      - name: Split Android SDK into chunks
        run: |
          cd /tmp
          split -b 48M -d android-sdk.tar $GITHUB_WORKSPACE/tools/chunks/android-sdk/android-sdk.tar.part.
          echo "Android SDK chunks:"
          ls -la $GITHUB_WORKSPACE/tools/chunks/android-sdk/
          echo "Chunk count: $(ls $GITHUB_WORKSPACE/tools/chunks/android-sdk/ | wc -l)"
          sha256sum $GITHUB_WORKSPACE/tools/chunks/android-sdk/* > $GITHUB_WORKSPACE/tools/chunks/android-sdk.sha256

      - name: Generate reassembly script
        run: |
          cat > tools/scripts/reassemble-tools.sh <<'REASSEMBLE_SCRIPT'
          #!/bin/bash
          # OneDoc Tool Reassembly Script
          # Reassembles chunked build tools from repo
          # Run: bash tools/scripts/reassemble-tools.sh

          set -e

          INSTALL_DIR="${HOME}/onedoc-tools"
          REPO_DIR="$(cd "$(dirname "$0")/../.." && pwd)"
          CHUNKS_DIR="${REPO_DIR}/tools/chunks"

          echo "=== OneDoc Tool Reassembly ==="
          echo "Install directory: ${INSTALL_DIR}"
          echo ""

          # ---------- Java 17 ----------
          echo "[1/3] Reassembling Java 17..."
          mkdir -p "${INSTALL_DIR}/java17"
          cat "${CHUNKS_DIR}/java17/"java17.tar.part.* > /tmp/java17.tar
          tar -xf /tmp/java17.tar -C "${INSTALL_DIR}/java17" --strip-components=1
          rm -f /tmp/java17.tar
          echo "Java 17 installed at: ${INSTALL_DIR}/java17"
          echo ""

          # ---------- Gradle 8.10.2 ----------
          echo "[2/3] Reassembling Gradle 8.10.2..."
          mkdir -p "${INSTALL_DIR}/gradle"
          cat "${CHUNKS_DIR}/gradle/"gradle.tar.part.* > /tmp/gradle.tar
          tar -xf /tmp/gradle.tar -C "${INSTALL_DIR}/gradle" --strip-components=1
          rm -f /tmp/gradle.tar
          echo "Gradle 8.10.2 installed at: ${INSTALL_DIR}/gradle"
          echo ""

          # ---------- Android SDK ----------
          echo "[3/3] Reassembling Android SDK..."
          mkdir -p "${INSTALL_DIR}/android-sdk"
          cat "${CHUNKS_DIR}/android-sdk/"android-sdk.tar.part.* > /tmp/android-sdk.tar
          tar -xf /tmp/android-sdk.tar -C "${INSTALL_DIR}/android-sdk" --strip-components=1
          rm -f /tmp/android-sdk.tar
          echo "Android SDK installed at: ${INSTALL_DIR}/android-sdk"
          echo ""

          echo "=== Reassembly Complete ==="
          echo "Add these to your ~/.bashrc or ~/.profile:"
          echo "export JAVA_HOME=${INSTALL_DIR}/java17"
          echo "export ANDROID_HOME=${INSTALL_DIR}/android-sdk"
          echo "export ANDROID_SDK_ROOT=\${ANDROID_HOME}"
          echo "export GRADLE_HOME=${INSTALL_DIR}/gradle/gradle-8.10.2"
          echo "export PATH=\${JAVA_HOME}/bin:\${GRADLE_HOME}/bin:\${ANDROID_HOME}/platform-tools:\${PATH}"
          echo ""
          echo "Then build OneDoc:"
          echo "  cd /path/to/Doc-"
          echo "  ./gradlew assembleRelease"
          REASSEMBLE_SCRIPT
          chmod +x tools/scripts/reassemble-tools.sh
          echo "Reassembly script generated"

      - name: Create chunk manifest
        run: |
          JAVA_CHUNKS=$(ls tools/chunks/java17/ 2>/dev/null | wc -l)
          GRADLE_CHUNKS=$(ls tools/chunks/gradle/ 2>/dev/null | wc -l)
          ANDROID_CHUNKS=$(ls tools/chunks/android-sdk/ 2>/dev/null | wc -l)
          cat > tools/chunks/CHUNKS.md <<EOF
          # OneDoc Tool Chunks

          Build tools are split into 48MB chunks for git storage.
          Reassemble with: bash tools/scripts/reassemble-tools.sh

          ## Chunks

          | Tool | Chunks | Approx Size |
          |------|--------|-------------|
          | Java 17 (Temurin 17.0.11+9) | ${JAVA_CHUNKS} | ~300MB |
          | Gradle 8.10.2 | ${GRADLE_CHUNKS} | ~200MB |
          | Android SDK 34 | ${ANDROID_CHUNKS} | ~500MB+ |

          ## Reassembly

          ```bash
          bash tools/scripts/reassemble-tools.sh
          ```

          Then set environment variables and build:

          ```bash
          export JAVA_HOME=~/onedoc-tools/java17
          export ANDROID_HOME=~/onedoc-tools/android-sdk
          export GRADLE_HOME=~/onedoc-tools/gradle/gradle-8.10.2
          export PATH=\$JAVA_HOME/bin:\$GRADLE_HOME/bin:\$ANDROID_HOME/platform-tools:\$PATH

          cd /path/to/Doc-
          ./gradlew assembleRelease
          ```

          ## Pre-built APK

          A pre-built release APK is already committed to the repo root:
          \`OneDoc-release.apk\` (versionCode 6, versionName 1.0.5)
          EOF
          echo "Chunk manifest created"

      - name: Commit chunks to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tools/chunks/ tools/scripts/reassemble-tools.sh 2>&1 | tee tools/scripts/commit.log
          git commit -m "chore: Commit chunked build tools (Java 17 + Android SDK 34 + Gradle 8.10.2) [skip ci]" 2>&1 | tee -a tools/scripts/commit.log
          git push 2>&1 | tee -a tools/scripts/commit.log
          echo "Tool chunks committed to repo" | tee -a tools/scripts/commit.log

      - name: Upload chunk logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-chunk-tools
          path: tools/scripts/
          retention-days: 30
          if-no-files-found: warn
