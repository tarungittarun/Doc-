name: Download and Chunk Build Tools

on:
  push:
    branches: ["arena/db667982-doc"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-chunk:
    name: Download, extract, and chunk build tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create directories
        run: |
          mkdir -p tools/chunks/java17 tools/chunks/gradle tools/chunks/android-sdk tools/scripts
          echo "Directories created"

      - name: Download Java 17 tarball
        run: |
          cd /tmp
          curl -fsSL --max-time 120 -L -o openjdk-17.tar.gz "https://api.adoptium.net/v3/binary/version/17.0.11%2B9/linux/x64/jdk/hotspot/normal/eclipse"
          ls -la openjdk-17.tar.gz
          file openjdk-17.tar.gz

      - name: Just echo
        run: echo "hello from chunking workflow"
