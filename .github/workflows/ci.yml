name: OneDoc CI — build, test, traceability

on:
  push:
    branches: ["arena/db667982-doc"]
  pull_request:
    branches: ["arena/db667982-doc"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Budget C8: max 3 parallel runners, <= 30 jobs per run. This lane: 6 jobs.
jobs:
  gradle-setup:
    name: Install Gradle + generate wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gradle-ready: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "GRADLE_HOME=/opt/gradle-8.10.2" >> $GITHUB_ENV
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Generate Gradle wrapper (gradle-wrapper.jar)
        run: gradle wrapper
      - name: Upload wrapper jar
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-jar-${{ github.run_id }}
          path: gradle/wrapper/gradle-wrapper.jar
          retention-days: 7

  traceability:
    name: Traceability --check --strict
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [gradle-setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tool deps
        run: python3 -m pip -q install pyyaml
      - name: Run traceability check (strict)
        run: python3 tools/onedoc/traceability.py --check --strict

  detekt:
    name: Detekt static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gradle-setup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gradle-wrapper-jar-${{ needs.gradle-setup.outputs.gradle-ready }}
          path: gradle/wrapper
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Run detekt
        run: ./gradlew detekt --no-daemon

  build-debug:
    name: Assemble debug APKs (full + writer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gradle-setup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gradle-wrapper-jar-${{ needs.gradle-setup.outputs.gradle-ready }}
          path: gradle/wrapper
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Assemble fullDebug + writerDebug
        run: ./gradlew assembleFullDebug assembleWriterDebug --no-daemon
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7

  build-release:
    name: Assemble release APKs (full + writer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-debug]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gradle-wrapper-jar-${{ needs.build-debug.outputs.gradle-ready }}
          path: gradle/wrapper
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Assemble fullRelease + writerRelease (RC debug-sign for QA until owner keystore)
        run: ./gradlew assembleFullRelease assembleWriterRelease --no-daemon
      - name: Compute APK SHA-256 + size
        run: |
          for apk in app/build/outputs/apk/**/release/*.apk; do
            echo "=== $apk ==="
            sha256sum "$apk"
            ls -l "$apk"
          done
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 30

  static-gates:
    name: Static gates (manifest + size)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [build-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: release-apks
      - name: Assert NO internet permission in manifest
        run: |
          set -e
          if grep -rqi 'android.permission.INTERNET\|ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml; then
            echo "::error::FAIL: internet permission present in manifest" >&2; exit 1
          fi
          echo "PASS: no internet permission in manifest"
      - name: Assert APK size <= 25 MB
        run: |
          set -e
          for apk in release-apks/**/*.apk; do
            size=$(stat -c%s "$apk")
            mb=$(( size / 1048576 ))
            echo "$apk = ${mb} MB"
            if [ "$size" -gt 26214400 ]; then
              echo "::error::FAIL: $apk exceeds 25 MB" >&2; exit 1
            fi
          done
          echo "PASS: all release APKs <= 25 MB"

  verify-ci-lane:
    name: CI lane green
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [traceability, detekt, build-debug, build-release, static-gates]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: |
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job statuses: $statuses"
          if echo "$statuses" | grep -q 'failure\|cancelled'; then
            echo "::error::CI lane not green — a required job failed or was cancelled" >&2
            exit 1
          fi
          echo "PASS: CI lane green"
