# OneDoc — task graph (single source of scheduling truth, work order §5)
# Schema per task:
#   id, phase, title, binding-spec [§ refs], acceptance [F/UX/TC ids or checks],
#   depends-on [task ids], estimate (agent-iterations proxy), artifacts [paths],
#   status [open | in-progress | blocked(reason) | done(evidence-ref)]
# Rules: update statuses in the same commit as the work; populate the next phase's
# slice at gate entry (§5), never from memory; placeholders below for G2–G8.

